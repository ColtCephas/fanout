<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fanout: write once, post everywhere</title>
<meta name="description" content="Fanout writes your posts with AI and sends them to every account you connect, four times a day.">
<meta name="theme-color" content="#05060a">
<meta property="og:title" content="Fanout: write once, post everywhere">
<meta property="og:description" content="One prompt. Every platform. Four posts a day.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f8fc;--card:#fff;--card2:#eef2fa;--text:#0b1220;--muted:#5a6578;--line:rgba(10,20,40,.12);--signal:#1f6bff;--signal-t:#fff;--a2:#06b6d4;--mint:#0f9f6e;--bad:#d6334f;--glow:rgba(31,107,255,.16);
--display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;--body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#05060a;--card:#0c0f16;--card2:#131824;--text:#f4f6fb;--muted:#8f98ad;--line:rgba(255,255,255,.1);--signal:#3b82ff;--a2:#22d3ee;--mint:#34d399;--bad:#ff6b81;--glow:rgba(59,130,255,.32);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#05060a;--card:#0c0f16;--card2:#131824;--text:#f4f6fb;--muted:#8f98ad;--line:rgba(255,255,255,.1);--signal:#3b82ff;--a2:#22d3ee;--mint:#34d399;--bad:#ff6b81;--glow:rgba(59,130,255,.32);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
/* Slim scrollbars: faint at rest, fade in when the cursor is over the area */
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--muted) 16%,transparent) transparent}
*:hover{scrollbar-color:color-mix(in srgb,var(--muted) 50%,transparent) transparent}
*::-webkit-scrollbar{width:6px;height:6px}
*::-webkit-scrollbar-track,*::-webkit-scrollbar-corner{background:transparent}
*::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--muted) 16%,transparent);border-radius:99px;border:1px solid transparent;background-clip:content-box;transition:background .25s ease}
*:hover::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--muted) 50%,transparent);background-clip:content-box}
*::-webkit-scrollbar-thumb:hover,*::-webkit-scrollbar-thumb:active{background:color-mix(in srgb,var(--muted) 80%,transparent);background-clip:content-box}
*::-webkit-scrollbar-button{display:none;width:0;height:0}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);line-height:1.55;overflow-x:clip}
body::before{content:"";position:absolute;top:0;left:0;right:0;height:760px;background:radial-gradient(55% 65% at 50% 0%,var(--glow),transparent 72%),radial-gradient(30% 40% at 85% 20%,rgba(34,211,238,.12),transparent 70%);pointer-events:none}
.hd,.shell,.land-w{position:relative;max-width:1120px;margin:0 auto;padding-left:18px;padding-right:18px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:16px;padding-bottom:10px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.3rem;letter-spacing:-.02em;color:var(--text);text-decoration:none}
.logo i{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--signal),var(--a2));display:inline-block;position:relative}
.logo i::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--bg)}
.topnav{display:none;gap:26px}
.topnav a{color:var(--muted);text-decoration:none;font-weight:500;font-size:.95rem}
.topnav a:hover{color:var(--text)}
.hr{display:flex;gap:8px;align-items:center}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;font-size:1.05rem}
.btn{display:inline-block;border:0;border-radius:12px;padding:12px 20px;font:600 .96rem var(--body);text-decoration:none;cursor:pointer;transition:transform .18s,box-shadow .18s;text-align:center}
.btn.main{background:var(--signal);color:#fff;box-shadow:0 12px 34px -10px var(--signal)}
.btn.main:hover{transform:translateY(-2px)}
.btn.lite{background:var(--text);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.sm{padding:8px 14px;font-size:.86rem;border-radius:10px}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.big{padding:15px 26px;font-size:1.02rem;border-radius:14px}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible,.ib:focus-visible{outline:3px solid var(--a2);outline-offset:2px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(2.9rem,10.5vw,5.8rem);line-height:.98;letter-spacing:-.04em;margin:0;max-width:12ch;background:linear-gradient(180deg,var(--text) 35%,color-mix(in srgb,var(--text) 40%,var(--signal)));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-family:var(--display);font-weight:700;font-size:clamp(1.7rem,5vw,2.6rem);letter-spacing:-.03em;line-height:1.06;margin:0 0 6px}
h3{font-family:var(--display);font-size:1.12rem;margin:0 0 4px}
.lead{font-size:1.12rem;color:var(--muted);max-width:50ch;margin:0}
.fine{font-size:.88rem;color:var(--muted);margin:0}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.hero{text-align:center;padding:46px 0 0;display:grid;justify-items:center;gap:22px}
.hero .cta{justify-content:center}
.pill{border:1px solid var(--line);background:var(--card);padding:7px 14px;border-radius:999px;color:var(--muted);font-size:.85rem;font-weight:500}
.pill b{color:var(--mint)}
.fan{width:100%;height:auto;max-width:760px;margin-top:10px;filter:drop-shadow(0 30px 60px var(--glow))}
.fan .src,.fan .node rect{fill:var(--card);stroke:var(--line);stroke-width:1.5}
.fan .src{stroke:var(--signal);stroke-width:2}
.fan text{fill:var(--text);font:600 15px var(--body);text-anchor:middle}
.beam{fill:none;stroke:var(--signal);stroke-width:2;stroke-linecap:round;stroke-dasharray:3 11;animation:flow 1.1s linear infinite}
.node{opacity:0;animation:pop .6s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*.13s + .35s)}
@keyframes flow{to{stroke-dashoffset:-28}}
@keyframes pop{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

@keyframes blink{50%{opacity:0}}
.sec{padding:64px 0 0;display:grid;gap:22px}
.sec>.fine{max-width:56ch}
.bento{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}.bento>*{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;display:grid;gap:12px;align-content:start}
.ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--card2);color:var(--signal)}
.slots4{display:flex;flex-wrap:wrap;gap:8px}
.slots4 span{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:6px 11px;font-weight:600;font-size:.88rem}
.steps{display:grid;gap:14px}
.steps .num{font-family:var(--display);font-size:2.4rem;font-weight:800;color:var(--signal);line-height:1}
.price strong{font-family:var(--display);font-size:2.4rem;letter-spacing:-.03em}
.price ul{margin:0;padding-left:18px;color:var(--muted)}
.price.hot{border-color:var(--signal);box-shadow:0 0 0 1px var(--signal) inset,0 30px 60px -40px var(--signal)}
details{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
summary{cursor:pointer;font-weight:600}
details p{margin:10px 0 0;color:var(--muted)}
.band{text-align:center;justify-items:center;padding:34px 18px;background:linear-gradient(135deg,color-mix(in srgb,var(--signal) 24%,var(--card)),var(--card))}
.fgrid{display:grid;gap:22px;padding:40px 0 14px}
.fgrid b{display:block;margin-bottom:8px}
.fgrid a,.fgrid span{display:block;color:var(--muted);text-decoration:none;font-size:.93rem;margin-bottom:4px}
#ft{padding-bottom:30px}
#ft .fine{padding-top:12px;border-top:1px solid var(--line)}
.shell{display:block}
.page{display:grid;gap:14px;padding:6px 0 20px}
#side,.bot{display:none}
.grid{display:grid;gap:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat strong{display:block;font-family:var(--display);font-size:2rem;letter-spacing:-.03em;line-height:1}
.stat span{color:var(--muted);font-size:.9rem}
label{display:block;font-weight:600;font-size:.92rem;margin-bottom:6px}
input,textarea,select{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
textarea{min-height:92px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 13px;border-radius:999px;font:500 .9rem var(--body);cursor:pointer}

#lt{min-height:3.4em;font-size:1.1rem}

.row{display:flex;align-items:center;gap:12px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:11px 13px;animation:in .3s ease}
.row .m{flex:1;min-width:0}
.row b{display:block;font-weight:600}
.row small{display:block;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:.82rem;font-weight:600;color:var(--muted)}

.spin{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--signal);animation:rot .7s linear infinite;flex:none}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line);flex:none}
.dot.ok{background:var(--mint)}.dot.no{background:var(--bad)}
.plans{display:grid;gap:12px}
.plan.cur{border-color:var(--signal);box-shadow:0 0 0 2px var(--signal) inset}
.plan strong{font-family:var(--display);font-size:1.8rem}
.plan ul{margin:0;padding-left:18px;color:var(--muted)}
.ring{width:60px;height:60px;flex:none}
#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));background:rgba(3,4,10,.65);z-index:40}
#modal.show{display:flex}
.box{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;width:100%;max-width:420px;display:grid;gap:12px;animation:in .25s ease;max-height:100%;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.box .stk{position:sticky;bottom:-20px;background:var(--card);padding:12px 0 20px;margin:0 0 -20px;border-top:1px solid var(--line);z-index:2}
.tp{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.tp select{width:100%;font-size:1.05rem;padding:12px 10px}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:600;font-size:.92rem;z-index:50;max-width:92%;display:none}
#toast.show{display:block;animation:in .25s ease}
.burst{position:fixed;left:50%;top:45%;z-index:45;pointer-events:none}
.burst span{position:absolute;width:10px;height:10px;border-radius:50%;animation:bz .9s ease-out forwards}
@keyframes bz{to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
.mock{border:1px solid var(--line);border-radius:20px;background:var(--card);box-shadow:0 50px 100px -50px var(--signal);overflow:hidden;transform:perspective(1500px) rotateX(5deg);transform-origin:50% 0;transition:transform .5s}
.mock:hover{transform:perspective(1500px) rotateX(0)}
.mbar{display:flex;align-items:center;gap:6px;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--card2)}
.mbar i{width:10px;height:10px;border-radius:50%;background:#ff5f57}
.mbar i:nth-child(2){background:#febc2e}.mbar i:nth-child(3){background:#28c840}
.mbar span{margin-left:10px;font-size:.78rem;color:var(--muted)}
.mbody{padding:18px;display:grid;gap:12px}
.tr{display:grid;gap:10px}
.pc{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:13px;display:grid;gap:8px;animation:in .5s cubic-bezier(.2,.8,.2,1) both}
.pc b{display:flex;align-items:center;gap:8px}
.pc b i{width:10px;height:10px;border-radius:50%;display:inline-block}
.pc p{margin:0;font-size:.92rem;white-space:pre-wrap;word-break:break-word}
.rv{opacity:0;transform:translateY(26px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
.bar{transform-origin:bottom;transform-box:fill-box;animation:grow .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*.07s);fill:var(--signal)}
@keyframes grow{from{transform:scaleY(0)}}
@media (min-width:900px){.tr{grid-template-columns:repeat(3,1fr)}}

.cal{display:grid;grid-template-columns:48px repeat(7,1fr);gap:6px;align-items:center;font-size:.74rem;color:var(--muted);text-align:center}
.cal b{font-weight:600}
.seg{display:inline-flex;background:var(--card2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font:600 .8rem var(--body);padding:6px 12px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--text);box-shadow:0 0 0 1px var(--line)}
.num{font-variant-numeric:tabular-nums}
.cl{fill:none;stroke:url(#cg);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s cubic-bezier(.2,.8,.2,1) forwards}

.ca{opacity:0;animation:fadein .9s .5s ease forwards}

.cpt{fill:var(--bg);stroke:var(--signal);stroke-width:2;transition:fill .2s}

.pulse{fill:var(--a2);transform-box:fill-box;transform-origin:center;animation:pls 1.8s ease-out infinite}
@keyframes pls{from{transform:scale(1);opacity:.55}to{transform:scale(3.2);opacity:0}}
@media (prefers-reduced-motion:reduce){.cl{animation:none;stroke-dashoffset:0}.ca{animation:none;opacity:1}.pulse{display:none}}
.mcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cdh{font-size:.72rem;color:var(--muted);text-align:center;padding:4px 0}

.cday.out{opacity:.45}.cday.today{outline:2px solid var(--signal);outline-offset:-2px}.cday.drop{background:var(--card2)}
.cn{font-size:.72rem;color:var(--muted)}

.legal details{margin-bottom:8px}

.colh{display:flex;justify-content:space-between;align-items:center}

.box .ng{padding:10px 0 2px}
.auth{max-width:440px;margin:26px auto;width:100%}

.lg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}

.tpls{display:flex;gap:8px;flex-wrap:wrap}

 body.appv .shell{padding-bottom:92px}

}

calendar:function(){
 var now=new Date();if(!CM)CM={y:now.getFullYear(),m:now.getMonth()};
 var all=calAll(),first=new Date(CM.y,CM.m,1),start=new Date(CM.y,CM.m,1-first.getDay()),today=ymd(now);
 var dh=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(function(d){return '<div class="cdh">'+d+'</div>'}).join("");
 var cells=Array.apply(null,Array(42)).map(function(_,i){var dd=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i),k=ymd(dd);
  var its=all.filter(function(a){return a.x.when.slice(0,10)===k}).sort(function(a,b){return a.x.when<b.x.when?-1:1}),
   sent=S.hist.filter(function(q){return q.at&&ymd(new Date(q.at))===k&&q.st!=="sending"}),chips=[];
  its.forEach(function(a){chips.push('<button class="ci'+(a.kind==="pend"?" pend":"")+'" type="button" draggable="true" data-cid="'+a.x.id+'" data-a="cedit" data-v="'+a.x.id+'" title="'+esc(a.x.txt)+'">'+from24(a.x.when.slice(11)).replace(":00","")+' '+esc(a.x.p||"All")+'</button>')});
  sent.forEach(function(q){chips.push('<span class="ci '+(q.st==="failed"?"fail":"sent")+'" title="'+esc(q.txt)+'">'+(q.st==="failed"?"Failed ":"Sent ")+esc(q.p)+'</span>')});
  var extra=chips.length>3?'<span class="cn">+'+(chips.length-3)+' more</span>':'';
  return '<div class="cday'+(dd.getMonth()!==CM.m?" out":"")+(k===today?" today":"")+'" data-day="'+k+'" data-a="dayadd" data-v="'+k+'" aria-label="Add a post on '+k+'"><span class="cn">'+dd.getDate()+'</span>'+chips.slice(0,3).join("")+extra+'</div>'}).join("");
 var up=all.filter(function(a){return a.x.when>=ymd(now)}).sort(function(a,b){return a.x.when<b.x.when?-1:1}).slice(0,8).map(function(a){var w=a.x.when.split("T");return '<div class="row"><div class="m"><b>'+new Date(w[0]+"T12:00").toLocaleDateString([],{weekday:"short",month:"short",day:"numeric"})+', '+from24(w[1])+' - '+esc(a.x.p||"All accounts")+'</b><small>'+esc(a.x.txt)+'</small></div><button class="btn ghost sm" data-a="cedit" data-v="'+a.x.id+'">Edit</button></div>'}).join("")||'<p class="fine">Nothing scheduled. Add posts to the queue on the Create page, or plan a week on the Schedule page.</p>';
 return '<h2>Calendar</h2>'+calGuide(all.length)+'<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><h3 style="margin:0">'+first.toLocaleDateString([],{month:"long",year:"numeric"})+'</h3><div class="cta"><button class="btn ghost sm" data-a="calprev" aria-label="Previous month">Back</button><button class="btn ghost sm" data-a="caltoday">Today</button><button class="btn ghost sm" data-a="calnext" aria-label="Next month">Next</button></div></div><div class="mcal">'+dh+cells+'</div></div><div class="card"><h3>Coming up</h3>'+up+'</div>'},
